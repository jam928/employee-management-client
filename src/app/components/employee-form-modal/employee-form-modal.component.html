<div class="modal-header">
  <h5 class="modal-title">{{ employee ? 'Edit Employee' : 'Add Employee' }}</h5>
  <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <form #form="ngForm" (ngSubmit)="save()">
    <div class="form-group">
      <label for="employee-name" class="col-form-label">Name</label>
      <input type="text" [(ngModel)]="details.name" name="name" class="form-control"
        id="employee-name" placeholder="Name" required />
    </div>
    <div class="form-group">
      <label for="employee-email" class="col-form-label">Email Address</label>
      <input type="email" [(ngModel)]="details.email" name="email" class="form-control"
        id="employee-email" placeholder="Email" required />
    </div>
    <div class="form-group">
      <label for="employee-job" class="col-form-label">Job Title</label>
      <input type="text" [(ngModel)]="details.jobTitle" name="jobTitle" class="form-control"
        id="employee-job" placeholder="Job Title" required />
    </div>
    <div class="form-group">
      <label for="employee-phone" class="col-form-label">Phone</label>
      <input type="text" [(ngModel)]="details.phone" name="phone" class="form-control"
        id="employee-phone" placeholder="555-555-5555" required />
    </div>
    <app-photo-picker
      [imageUrl]="employee?.imageUrl"
      [name]="details.name"
      (photoChange)="onPhotoChange($event)"
    ></app-photo-picker>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Close</button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save changes</button>
    </div>
  </form>
</div>
